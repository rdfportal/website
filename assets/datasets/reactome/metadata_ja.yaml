title: Reactome RDF
website: https://reactome.org/
description: Reactome RDFは、専門家によるキュレーションと査読を経た生物学的パスウェイデータベースReactomeを、BioPAX Level 3形式で表現したデータセットです。代謝、シグナル伝達、遺伝子発現制御、疾患に関わるパスウェイと反応を記述し、反応に参加するタンパク質、複合体、低分子化合物を、根拠文献や外部データベースと関連付けています。
