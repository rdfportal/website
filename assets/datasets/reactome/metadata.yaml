description: Reactome RDF is a BioPAX Level 3 representation of Reactome, an expert-curated and peer-reviewed biological pathway database. It describes pathways and reactions involved in metabolism, signaling, gene regulation, and disease, linking participating proteins, complexes, and small molecules with supporting literature and external databases.
