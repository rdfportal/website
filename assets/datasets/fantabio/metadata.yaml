title: fanta.bio
website: https://fanta.bio/
description: fanta.bio (Functional genome ANnotations with Transcriptional Activities) is a database of functional genome annotations focused on cis-regulatory elements, such as promoters and enhancers. It integrates regulatory elements identified using CAGE data and their transcriptional activities across cell and tissue types with transcription factor binding sites and genomic variants to support studies of gene regulation.
