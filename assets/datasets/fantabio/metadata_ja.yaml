description: fanta.bio（Functional genome ANnotations with Transcriptional Activities）は、プロモーターやエンハンサーなどのシス制御領域を中心としたゲノム機能アノテーションデータベースです。CAGEデータを用いて同定した制御領域と、細胞・組織ごとの転写活性に、転写因子結合部位やゲノム変異の情報を統合し、遺伝子発現制御の研究を支援します。
