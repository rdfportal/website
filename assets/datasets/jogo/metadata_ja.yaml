title: JoGo
website: https://jogo.csml.org/
description: JoGo RDFは、Joint Open Genome and Omics Platform（JoGo）が主にロングリードシーケンスデータを用いて構築した、ヒトのハプロタイプカタログのRDF版です。JoGoは、タンパク質コード遺伝子のハプロタイプをアミノ酸配列、コード配列、転写産物、遺伝子全体の各レベルでカタログ化し、一塩基バリアント、挿入、欠失の情報とともに提供しています。
