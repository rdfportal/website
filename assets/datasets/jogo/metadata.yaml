title: JoGo
website: https://jogo.csml.org/
description: JoGo RDF is an RDF representation of the human haplotype catalog developed by the Joint Open Genome and Omics Platform (JoGo), primarily using long-read sequencing data. JoGo catalogs haplotypes of protein-coding genes at the amino acid, coding sequence, transcript, and whole-gene levels, together with single-nucleotide variants, insertions, and deletions.
