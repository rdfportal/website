title: TiSMeD RDF
website: https://www.bio-add.org/TiSMeD/  
description: 
TiSMeD RDFは、TiSMeDが配布するオリジナルデータをもとに、DBCLSがRDF化したデータセットです。TiSMeDは、組織特異的なDNAメチル化、遺伝子発現、タンパク質発現のデータを統合したデータベースです。組織特異的なメチル化部位、遺伝子、タンパク質の情報を提供し、がん診断のためのバイオマーカー探索や、血中循環セルフリーDNAの由来組織の同定を支援します。
tags: ["Expression", "Methylation"]
