title: ODB
website: https://operondb.jp/
description: ODB (Operon DataBase) collects known operons reported in the literature and conserved operons inferred across genomes. This RDF dataset represents known operons, linking each operon to its organism through an NCBI Taxonomy identifier, to the proteins encoded by its member genes through NCBI Protein identifiers, and to supporting publications through PubMed identifiers. These links support integrated searches of operon organization, taxonomic information, and literature evidence.
