title: ChEMBL RDF
website: https://www.ebi.ac.uk/chembl/
description: ChEMBL RDF is an RDF representation of ChEMBL, a manually curated database of bioactive molecules maintained by EMBL-EBI. It links chemical structures and molecular properties with biological activity measurements, assays, targets, and source publications, supporting drug discovery and research into compound–target interactions.
