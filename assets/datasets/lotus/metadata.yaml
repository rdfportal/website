title: LOTUS
website: https://lotus.naturalproducts.net/
description: LOTUS is a database of natural product occurrences that links chemical compounds to the organisms in which they have been reported and the supporting literature. It integrates chemical structures, taxonomic information, and references to support research on natural products and their distribution across organisms.
