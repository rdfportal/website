title: Cellosaurus 
website: https://www.cellosaurus.org/
description: Cellosaurus is a comprehensive knowledge resource describing cell lines used in biomedical research, including immortalized and finite cell lines, stem cell lines, and cell lines derived from vertebrates, invertebrates, and plants. Each cell line is assigned a unique accession and is annotated with curated information such as recommended names and synonyms, species of origin, tissue and cell type, disease associations, donor characteristics, genetic alterations, STR profiles, publications, and cross-references to cell banks and external databases. The RDF representation structures these data and their relationships using the Cellosaurus ontology and links them to established biological databases and ontologies, facilitating integrated search and analysis across life science RDF datasets. 
